# ============================================================
# 1. ADMIN PANEL (admin.brgysanmanuel.com)
# ============================================================
server {
    listen 80;
    listen 443 ssl;
    listen 4200 ssl;
    server_name admin.brgysanmanuel.com;

    ssl_certificate /etc/ssl/certs/kiosk.crt;
    ssl_certificate_key /etc/ssl/private/kiosk.key;

    root /var/www/ims-iot-document-kiosk/dist/admin-panel/browser;
    index index.html index.csr.html;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
    }
}

