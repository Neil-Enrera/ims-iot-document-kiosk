# ============================================================
# Barangay San Manuel IMS - Cloudflare / Nginx Production Configuration
# ============================================================

# 1. Kiosk Application (https://kiosk.brgysanmanuel.com)
server {
    listen 80;
    server_name kiosk.brgysanmanuel.com;
    root /var/www/ims-iot-document-kiosk/dist/kiosk-app/browser;
    index index.html;

    # Angular SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy (Port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Hardware WebSocket Proxy (Port 3001)
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

